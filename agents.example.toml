# Agora catalog. Copy to agents.toml and keep only the agents you have.
#
# Every CLI below has a headless / non-interactive mode. Quota shapes are the
# publicly documented free or subscription limits as of October 2026; set
# caps_known = false where the vendor does not publish a number and the
# ledger will learn the cap from the first rate limit. Capabilities are priors
# in [0, 1] per role; the bandit refines them from observed reliability.

# ---- Anthropic -------------------------------------------------------------
[[agents]]
id = "claude-code"
provider = "anthropic"
kind = "cli"
tier = "subscription"
argv = ["claude", "-p", "{prompt}", "--output-format", "json"]
read_only_argv = ["--safe-mode", "--allowedTools", "Read,Glob,Grep", "--permission-mode", "dontAsk"]
resume_argv = ["--resume"]
output_format = "json"
reset = "rolling"
caps_known = false
context_window = 200000
[agents.capabilities]
plan = 0.95
review = 0.95
build = 0.9
inspect = 0.95
judge = 0.9
research = 0.8
[[agents.windows]]
name = "5h"
seconds = 18000

# ---- OpenAI ----------------------------------------------------------------
[[agents]]
id = "codex"
provider = "openai"
kind = "cli"
tier = "subscription"
argv = ["codex", "exec", "--json", "{prompt}"]
read_only_argv = ["-s", "read-only", "--disable", "apps", "--disable", "plugins"]
output_format = "stream-json"
reset = "rolling"
caps_known = false
context_window = 200000
[agents.capabilities]
plan = 0.9
review = 0.95
build = 0.9
inspect = 0.95
judge = 0.9
research = 0.7
[[agents.windows]]
name = "5h"
seconds = 18000

