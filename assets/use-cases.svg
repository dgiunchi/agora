  <text x="440" y="240" font-size="13" fill="#b9c3e6">• the red team's only job is to break the plan</text>
<text x="440" y="262" font-size="13" fill="#b9c3e6">• every material finding goes back to the planner</text>
<text x="440" y="284" font-size="13" fill="#b9c3e6">• judge: 3rd provider, proof, or both; proof wins</text>
<text x="440" y="306" font-size="13" fill="#b9c3e6">• fixture: parse_size() with 9 tests, 15 reject cases</text>
  <text x="440" y="340" font-size="12" font-weight="600" fill="#ff5e62">Live 2026-10-29: completed, 0 fallbacks, 8 low findings</text>
