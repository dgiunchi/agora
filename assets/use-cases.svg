  <text x="60" y="240" font-size="13" fill="#b9c3e6">• a different provider reviews and inspects</text>
<text x="60" y="262" font-size="13" fill="#b9c3e6">• approval bound to the plan's SHA256</text>
<text x="60" y="284" font-size="13" fill="#b9c3e6">• proof must pass before anyone inspects</text>
<text x="60" y="306" font-size="13" fill="#b9c3e6">• fixture: slugify() with 5 failing tests</text>
  <text x="60" y="340" font-size="12" font-weight="600" fill="#5ac8fa">Live 2026-10-29: completed, 1 fallback, 5/5</text>
