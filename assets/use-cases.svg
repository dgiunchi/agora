  <text x="60" y="72" font-size="19" font-weight="700" fill="#5ac8fa">1. Ship a feature nobody self-approved</text>
  <text x="60" y="96" font-size="12" fill="#8e9bc7">collaborative · plan → review → build → proof → inspect</text>
