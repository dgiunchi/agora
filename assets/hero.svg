<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151d3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a623"/><stop offset="1" stop-color="#ff5e62"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6a623" stop-opacity="0.35"/><stop offset="1" stop-color="#f6a623" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="930" cy="200" r="220" fill="url(#glow)"/>

  <!-- orbiting agents -->
  <g stroke="#2d3a66" stroke-width="1.5" fill="none">
    <circle cx="930" cy="200" r="120"/>
    <circle cx="930" cy="200" r="70" stroke-dasharray="4 6"/>
  </g>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <g transform="translate(930,80)"><circle r="26" fill="#1f2a4d" stroke="#f6a623" stroke-width="2"/><text y="5" fill="#fff">plan</text></g>
    <g transform="translate(1050,200)"><circle r="26" fill="#1f2a4d" stroke="#5ac8fa" stroke-width="2"/><text y="5" fill="#fff">review</text></g>
    <g transform="translate(930,320)"><circle r="26" fill="#1f2a4d" stroke="#34d399" stroke-width="2"/><text y="5" fill="#fff">build</text></g>
    <g transform="translate(810,200)"><circle r="26" fill="#1f2a4d" stroke="#ff5e62" stroke-width="2"/><text y="5" fill="#fff">inspect</text></g>
    <g transform="translate(930,200)"><circle r="40" fill="url(#accent)"/><text y="-4" fill="#0b1020" font-size="12">quota</text><text y="12" fill="#0b1020" font-size="12">allocator</text></g>
  </g>
  <g fill="#8e9bc7" font-size="11" text-anchor="middle">
    <text x="1015" y="118">anthropic</text><text x="1015" y="292">openai</text><text x="845" y="292">google</text><text x="845" y="118">free tier</text>
  </g>

  <!-- title -->
  <text x="70" y="140" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Agora</text>
  <text x="72" y="190" font-size="26" fill="url(#accent)" font-weight="600">Your free tiers, working together.</text>
  <text x="72" y="236" font-size="19" fill="#b9c3e6">Where free agents argue until the code is right.</text>

  <!-- stat pills -->
  <g font-size="14" font-weight="600">
    <rect x="72" y="276" width="190" height="40" rx="20" fill="#1f2a4d" stroke="#2d3a66"/>
    <text x="167" y="301" fill="#ffffff" text-anchor="middle">12 agents in the catalog</text>
    <rect x="276" y="276" width="170" height="40" rx="20" fill="#1f2a4d" stroke="#2d3a66"/>
    <text x="361" y="301" fill="#ffffff" text-anchor="middle">3 strategies</text>
    <rect x="460" y="276" width="220" height="40" rx="20" fill="#1f2a4d" stroke="#2d3a66"/>
    <text x="570" y="301" fill="#ffffff" text-anchor="middle">0 pip dependencies, 3 OSes</text>
  </g>
  <text x="72" y="356" font-size="14" fill="#6f7ba6">Borrows quota pooling from FreeLLMAPI and the plan / review / build / inspect loop from Claudex Loop.</text>
</svg>