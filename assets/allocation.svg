<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8e9bc7"/></marker></defs>
  <rect width="1200" height="440" rx="24" fill="#0b1020"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#fff">One role in, the best eligible agent out</text>
  <text x="40" y="76" font-size="14" fill="#8e9bc7">Example: filling the review role after the planner was claude-code. The same criteria FreeLLMAPI applies to models, applied to whole agentic systems.</text>

  <!-- column 1: catalog with headroom bars -->
  <text x="40" y="118" font-size="13" fill="#f6a623" font-weight="700">CATALOG + LEDGER</text>
  <g font-size="13" fill="#fff">
    <g transform="translate(40,135)">
      <rect width="300" height="34" rx="8" fill="#1f2a4d"/><text x="12" y="22">claude-code</text><rect x="150" y="11" width="120" height="12" rx="6" fill="#2d3a66"/><rect x="150" y="11" width="78" height="12" rx="6" fill="#34d399"/><text x="278" y="22" font-size="11" fill="#8e9bc7">0.65</text>
    </g>
    <g transform="translate(40,177)">
      <rect width="300" height="34" rx="8" fill="#1f2a4d"/><text x="12" y="22">codex</text><rect x="150" y="11" width="120" height="12" rx="6" fill="#2d3a66"/><rect x="150" y="11" width="6" height="12" rx="6" fill="#ff5e62"/><text x="278" y="22" font-size="11" fill="#ff5e62">429</text>
    </g>
    <g transform="translate(40,219)">
      <rect width="300" height="34" rx="8" fill="#1f2a4d"/><text x="12" y="22">gemini-cli</text><rect x="150" y="11" width="120" height="12" rx="6" fill="#2d3a66"/><rect x="150" y="11" width="110" height="12" rx="6" fill="#34d399"/><text x="278" y="22" font-size="11" fill="#8e9bc7">0.92</text>
    </g>
    <g transform="translate(40,261)">
      <rect width="300" height="34" rx="8" fill="#1f2a4d"/><text x="12" y="22">qwen-code</text><rect x="150" y="11" width="120" height="12" rx="6" fill="#2d3a66"/><rect x="150" y="11" width="120" height="12" rx="6" fill="#34d399"/><text x="278" y="22" font-size="11" fill="#8e9bc7">1.00</text>
    </g>
    <g transform="translate(40,303)">
      <rect width="300" height="34" rx="8" fill="#1f2a4d"/><text x="12" y="22">freellmapi (http)</text><rect x="150" y="11" width="120" height="12" rx="6" fill="#2d3a66"/><rect x="150" y="11" width="100" height="12" rx="6" fill="#34d399"/><text x="278" y="22" font-size="11" fill="#8e9bc7">0.84</text>
    </g>
  </g>
  <text x="40" y="365" font-size="11" fill="#6f7ba6">bar = headroom, min over RPM / RPD / TPM / TPD windows; unknown caps are learned from the first 429</text>

  <path d="M350 240H400" stroke="#8e9bc7" stroke-width="2" marker-end="url(#a)"/>

  <!-- column 2: filters -->
  <text x="420" y="118" font-size="13" fill="#5ac8fa" font-weight="700">HARD FILTERS</text>
  <g font-size="13">
    <rect x="420" y="135" width="330" height="200" rx="12" fill="#131b36" stroke="#2d3a66"/>
    <text x="440" y="165" fill="#ff5e62">✗ claude-code</text><text x="560" y="165" fill="#8e9bc7">same provider as planner</text>
    <text x="440" y="195" fill="#ff5e62">✗ codex</text><text x="560" y="195" fill="#8e9bc7">in cooldown (backoff 60s)</text>
    <text x="440" y="225" fill="#34d399">✓ gemini-cli</text><text x="560" y="225" fill="#8e9bc7">review 0.85 ≥ 0.5</text>
    <text x="440" y="255" fill="#34d399">✓ qwen-code</text><text x="560" y="255" fill="#8e9bc7">review 0.75 ≥ 0.5</text>
    <text x="440" y="285" fill="#34d399">✓ freellmapi</text><text x="560" y="285" fill="#8e9bc7">review 0.70 ≥ 0.5</text>
    <text x="440" y="318" fill="#6f7ba6" font-size="11">capability · cooldown · headroom &gt; reserve · independence</text>
  </g>

  <path d="M760 240H810" stroke="#8e9bc7" stroke-width="2" marker-end="url(#a)"/>

  <!-- column 3: bandit -->
  <text x="830" y="118" font-size="13" fill="#34d399" font-weight="700">THOMPSON BANDIT · auto:smart</text>
  <g font-size="13">
    <rect x="830" y="135" width="330" height="200" rx="12" fill="#131b36" stroke="#2d3a66"/>
    <text x="850" y="162" fill="#8e9bc7" font-size="11">weights: capability 0.6 · reliability 0.2 · speed 0.1 · headroom 0.1</text>
    <g transform="translate(850,180)"><text y="14" fill="#fff">gemini-cli</text><rect x="110" y="3" width="180" height="14" rx="7" fill="#2d3a66"/><rect x="110" y="3" width="158" height="14" rx="7" fill="#34d399"/><text x="296" y="14" fill="#34d399" font-size="11">0.84</text></g>
    <g transform="translate(850,210)"><text y="14" fill="#fff">qwen-code</text><rect x="110" y="3" width="180" height="14" rx="7" fill="#2d3a66"/><rect x="110" y="3" width="138" height="14" rx="7" fill="#5ac8fa"/><text x="296" y="14" fill="#8e9bc7" font-size="11">0.73</text></g>
    <g transform="translate(850,240)"><text y="14" fill="#fff">freellmapi</text><rect x="110" y="3" width="180" height="14" rx="7" fill="#2d3a66"/><rect x="110" y="3" width="126" height="14" rx="7" fill="#5ac8fa"/><text x="296" y="14" fill="#8e9bc7" font-size="11">0.67</text></g>
    <rect x="850" y="275" width="290" height="44" rx="10" fill="#123b2a" stroke="#34d399"/>
    <text x="995" y="294" fill="#34d399" text-anchor="middle" font-weight="700">review → gemini-cli</text>
    <text x="995" y="311" fill="#8e9bc7" text-anchor="middle" font-size="11">logged: ALLOCATION role=review agent=gemini-cli headroom=0.92</text>
  </g>
  <text x="830" y="365" font-size="11" fill="#6f7ba6">auto:cheap flips the weights toward headroom and free tiers; auto:fast toward observed latency</text>

  <!-- dry run strip -->
  <rect x="40" y="385" width="1120" height="36" rx="10" fill="#131b36" stroke="#2d3a66"/>
  <text x="60" y="408" font-size="13" fill="#b9c3e6" font-family="Consolas, Menlo, monospace">$ agora run "add CSV import" --strategy hybrid --allocation auto:cheap --dry-run     # prints this plan, spends nothing</text>
</svg>