# Agora catalog. `agora agents init` writes this file as agents.toml; keep only
# the agents you have, then `agora agents doctor`.
#
# Every CLI below has a headless / non-interactive mode. Quota shapes are the
# publicly documented free or subscription limits as of October 2026; set
# caps_known = false where the vendor does not publish a number and the
# ledger will learn the cap from the first rate limit. Capabilities are priors
# in [0, 1] per role; the bandit refines them from observed reliability.
#
# Windows: npm installs these CLIs as .cmd shims. Agora never runs a shim
# through cmd.exe (it would re-parse the prompt); it reads the shim and runs
# `node <entry.js>` instead. If a shim cannot be resolved, pin the entry file:
#   node_entry = 'C:\Users\you\AppData\Roaming\npm\node_modules\@openai\codex\bin\codex.js'
#
# read_only_argv is appended for planners, reviewers, judges and inspectors,
# write_argv only for builders. Flags are a request: a read-only turn that
# changes the working tree fails regardless of what the CLI promised.

# ---- Anthropic -------------------------------------------------------------
[[agents]]
id = "claude-code"
provider = "anthropic"
kind = "cli"
tier = "subscription"
# Verified live 2026-10-29 (Claude Code 2.1.306). The builder gets edit permission and python;
# read-only roles disallow every mutating tool. --permission-mode repeats; the last one wins.
argv = ["claude", "-p", "{prompt}", "--output-format", "json", "--permission-mode", "acceptEdits", "--allowedTools", "Read", "Glob", "Grep", "Edit", "Write", "MultiEdit", "Bash(python*)"]
read_only_argv = ["--disallowedTools", "Edit", "Write", "MultiEdit", "NotebookEdit", "Bash", "--permission-mode", "dontAsk"]
resume_argv = ["--resume"]
output_format = "json"
reset = "rolling"
caps_known = false
context_window = 200000
[agents.capabilities]
plan = 0.95
review = 0.95
build = 0.9
inspect = 0.95
judge = 0.9
research = 0.8
[[agents.windows]]
name = "5h"
seconds = 18000

# ---- OpenAI ----------------------------------------------------------------
[[agents]]
id = "codex"
provider = "openai"
kind = "cli"
tier = "subscription"
# Verified live 2026-10-29 (codex-cli 0.153.4). ChatGPT accounts reject the CLI default model,
# so pin one explicitly with -m. Reviews run in the read-only sandbox; builds in workspace-write,
# as Claudex Loop does. `read_only_argv` / `write_argv` are appended by role, never both.
argv = ["codex", "exec", "--json", "--skip-git-repo-check", "-m", "gpt-6-astra", "{prompt}"]
model = "gpt-6-astra"
read_only_argv = ["-s", "read-only"]
write_argv = ["-s", "workspace-write"]
output_format = "stream-json"
reset = "rolling"
caps_known = false
context_window = 200000
[agents.capabilities]
plan = 0.9
review = 0.95
build = 0.9
inspect = 0.95
judge = 0.9
research = 0.7
[[agents.windows]]
name = "5h"
seconds = 18000

# ---- Google ----------------------------------------------------------------
[[agents]]
id = "gemini-cli"
provider = "google"
kind = "cli"
tier = "free"
# `--approval-mode plan` is Gemini CLI's read-only mode (`--sandbox` is a container, not
# read-only). Builders need an auto-approval mode to edit files headlessly.
argv = ["gemini", "-p", "{prompt}", "--output-format", "json"]
read_only_argv = ["--approval-mode", "plan"]
write_argv = ["--approval-mode", "auto_edit"]
output_format = "json"
reset = "utc-midnight"
caps_known = true
context_window = 1000000
[agents.capabilities]
plan = 0.85
review = 0.85
build = 0.8
inspect = 0.85
judge = 0.85
research = 0.9
[[agents.windows]]
name = "minute"
seconds = 60
requests = 60
[[agents.windows]]
name = "day"
seconds = 86400
requests = 1000

